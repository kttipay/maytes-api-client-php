# Verifies the published package installs and works on every PHP version its
# composer.json claims to support (`"php": "^8.1"`).
#
# The upstream pipeline that generates this repo only ever exercises one PHP
# version, so without this matrix the `^8.1` constraint is an untested claim.
#
# This file is generated — edit it at sdks/backend-sdk/mirror/php/ in the
# api-ts-v3 monorepo, not here.

name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  install:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, json, mbstring
          coverage: none

      - name: Validate composer.json
        run: composer validate --no-check-all --no-check-lock

      # No lock file is committed (this is a library), so this resolves the
      # dependency graph fresh — which is what a merchant's install does.
      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Smoke test
        run: php .github/smoke.php
